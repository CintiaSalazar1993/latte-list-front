<div class="selector" role="radiogroup" [attr.aria-label]="etiqueta()" (mouseleave)="hover.set(0)">
  @for (n of numeros; track n) {
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="valor() === n"
      [attr.aria-label]="n + (n === 1 ? ' grano' : ' granos')"
      [class.lleno]="n <= (hover() || valor())"
      [disabled]="deshabilitado()"
      (mouseenter)="hover.set(n)"
      (click)="elegir(n)"
      (blur)="alTocar()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="grano" /></svg>
    </button>
  }
  <span class="texto">{{ textos[hover() || valor()] }}</span>
</div>
