<div class="marco">
  <div class="tarjeta">
    <h1>Iniciar sesión</h1>
    <p class="sub">Entrá para ver los cafés, tus listas y tus reseñas.</p>

    @if (error()) {
      <div class="alerta" role="alert">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="campo">
        <label for="email">Email</label>
        <input id="email" class="input" type="email" formControlName="email" autocomplete="username" [ngClass]="{ invalido: invalido('email') }" />
        @if (invalido('email')) {
          <span class="error">Ingresá un email válido.</span>
        }
      </div>

      <div class="campo campo-pass">
        <label for="pass">Contraseña</label>
        <input id="pass" class="input" [type]="verPass() ? 'text' : 'password'" formControlName="contrasena" autocomplete="current-password" [ngClass]="{ invalido: invalido('contrasena') }" />
        <button type="button" class="ver" (click)="verPass.set(!verPass())" [attr.aria-pressed]="verPass()">
          {{ verPass() ? 'Ocultar' : 'Mostrar' }}
        </button>
      </div>
      @if (invalido('contrasena')) {
        <span class="error texto-chico">La contraseña es obligatoria.</span>
      }

      <button type="submit" class="btn btn-bloque" [disabled]="cargando()">
        {{ cargando() ? 'Entrando…' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="pie-form">¿No tenés cuenta? <a routerLink="/registro">Creá una</a></p>
  </div>
</div>
